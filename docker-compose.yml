# Local development stack. Copy .env.example to .env, fill in the secrets, then:
#   docker compose up -d mysql redis
#   docker compose run --rm migrate
#   docker compose up -d engine
# The MySQL accounts come from docker/mysql/init/01-users.sql (dev passwords; change on the VPS).

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: marsad-root-dev
      MYSQL_DATABASE: marsad
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    ports:
      - '127.0.0.1:3306:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command:
      ['redis-server', '--appendonly', 'yes', '--save', '', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  engine:
    build:
      context: .
      dockerfile: apps/engine/Dockerfile
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      REDIS_URL: redis://redis:6379
      PORT: '8080'
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: apps/engine/Dockerfile
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      REDIS_URL: redis://redis:6379
    command: ['node', 'apps/engine/dist/db/migrate.js']
    depends_on:
      mysql:
        condition: service_healthy
    profiles: ['tools']

volumes:
  mysql-data:
  redis-data:
